<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Saxon server</title>
    <link rel="stylesheet" href="codemirror/codemirror.min.css" />
    <style>
      :root {
        --accent: #2563eb;
        --border: #d1d5db;
        --bg: #f9fafb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        background: var(--bg);
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #111827;
      }

      main {
        background: #fff;
        padding: 1rem;
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      form {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }

      .fields {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-auto-rows: minmax(0, 1fr);
        gap: 1rem;
        flex: 1;
        min-height: 0;
      }

      .field {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }

      label {
        font-weight: 600;
        margin-bottom: 0.4rem;
      }

      textarea {
        width: 100%;
        height: 100%;
        flex: 1;
        min-height: 0;
        padding: 0.6rem;
        font-family: "SFMono-Regular", Consolas, Menlo, monospace;
        font-size: 0.9rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        resize: none;
      }

      .options {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 1rem;
        margin-top: 1rem;
      }

      input[type="text"] {
        width: 100%;
        padding: 0.5rem 0.6rem;
        font-family: "SFMono-Regular", Consolas, Menlo, monospace;
        font-size: 0.9rem;
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      textarea:focus,
      input[type="text"]:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }

      .CodeMirror {
        flex: 1;
        height: auto;
        min-height: 0;
        font-family: "SFMono-Regular", Consolas, Menlo, monospace;
        font-size: 0.9rem;
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      .CodeMirror-focused {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }

      button {
        display: block;
        margin: 1.5rem auto 0;
        padding: 0.6rem 2rem;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.15s ease-in-out;
      }

      button:hover {
        background: #1d4ed8;
      }

      @media (max-width: 700px) {
        .fields,
        .options {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <form id="transformForm" action="/transform" method="post" enctype="multipart/form-data">
        <div class="fields">
          <div class="field">
            <label for="xml">XML</label>
            <textarea id="xml" name="xml" rows="10" cols="50">&lt;?xml version="1.0" encoding="UTF-8"?&gt;
&lt;greeting&gt;
  &lt;message&gt;Hello, World!&lt;/message&gt;
&lt;/greeting&gt;
</textarea>
          </div>
          <div class="field">
            <label for="xsl">XSLT</label>
            <textarea id="xsl" name="xsl" rows="10" cols="50">&lt;?xml version="1.0" encoding="UTF-8"?&gt;
&lt;xsl:stylesheet version="1.0" xmlns:xsl="http://www.w3.org/1999/XSL/Transform"&gt;
  &lt;xsl:output method="html" media-type="text/html" indent="yes"/&gt;

  &lt;xsl:template match="/greeting"&gt;
    &lt;html&gt;
      &lt;body&gt;
        &lt;h1&gt;&lt;xsl:value-of select="message"/&gt;&lt;/h1&gt;
      &lt;/body&gt;
    &lt;/html&gt;
  &lt;/xsl:template&gt;
&lt;/xsl:stylesheet&gt;
</textarea>
          </div>
        </div>
        <div class="options">
          <div class="field">
            <label for="parameters">Stylesheet parameters</label>
            <input type="text" id="parameters" name="parameters" placeholder="myParam=value;other=value" spellcheck="false">
          </div>
          <div class="field">
            <label for="output">Serialization parameters</label>
            <input type="text" id="output" name="output" placeholder="method=xml;indent=yes" spellcheck="false">
          </div>
        </div>
        <div id="file" style="margin: 10px 0;">
          <label for="fileInput">Additional files</label>  
          <input type="file" id="fileInput" name="fileInput" multiple>  
        </div>
        <button type="submit">Transform</button>
      </form>
    </main>
    <script src="codemirror/codemirror.min.js"></script>
    <script src="codemirror/xml.min.js"></script>
    <script>
      for (const id of ["xml", "xsl"]) {
        CodeMirror.fromTextArea(document.getElementById(id), {
          mode: "xml",
          lineNumbers: true,
        });
      }

      // The server rejects an empty "parameters" or "output" part, so leave
      // those fields out of the request when they are blank.
      document.getElementById("transformForm").addEventListener("formdata", (e) => {
        for (const name of ["parameters", "output"]) {
          const value = (e.formData.get(name) || "").trim();
          if (value) {
            e.formData.set(name, value);
          } else {
            e.formData.delete(name);
          }
        }
      });
    </script>
  </body>
</html>
